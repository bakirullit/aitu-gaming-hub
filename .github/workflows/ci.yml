name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    name: Run Pytest & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: aitu_gaming_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_test_password@localhost:5432/aitu_gaming_hub_test
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: "123456789:TEST_MOCK_TOKEN"
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_test_password@localhost:5432/aitu_gaming_hub_test
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: "123456789:TEST_MOCK_TOKEN"
        run: |
          pytest -v

  build-frontend:
    name: Build Vue 3 Frontend SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web/app
        run: npm ci

      - name: Build Production Bundle
        working-directory: web/app
        run: npm run build
